[project]
name = "api-bancaria"
version = "0.1.0"
description = "API Bancaria Assincrona com FastAPI e JWT"
authors = [
    {name = "Gabriella", email = "gabriellacosta356@gmail.com"}
]
requires-python = ">=3.12"
dependencies = [
    "fastapi (>=0.115.0)",
    "uvicorn[standard] (>=0.30.0)",
    "sqlalchemy (>=2.0.0)",
    "alembic (>=1.13.0)",
    "aiosqlite (>=0.20.0)",
    "python-jose[cryptography] (>=3.3.0)",
    "passlib[bcrypt] (>=1.7.4)",
    "python-multipart (>=0.0.9)",
    "databases[aiosqlite] (>=0.9.0)",
    "pydantic-settings (>=2.2.1)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"